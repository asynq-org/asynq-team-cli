[build-system]
requires = ["poetry-core>=1.9,<3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "asynq-team-cli"
version = "0.1.0"
description = "CLI for the local-first Asynq Team runtime."
readme = "README.md"
packages = [{ include = "asynq_team_cli", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4"
asynq-team-core = ">=0.1.0"
rich = ">=13,<15"
typer = ">=0.12,<1"

[tool.poetry.scripts]
team = "asynq_team_cli.main:app"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
ruff = ">=0.6,<1"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
