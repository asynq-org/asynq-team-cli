[build-system]
requires = ["poetry-core>=1.9,<3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "asynq-team-cli"
version = "0.1.20"
description = "CLI for the local-first Asynq Team runtime."
readme = "README.md"
requires-python = ">=3.12,<4"
dynamic = ["dependencies"]

[project.scripts]
team = "asynq_team_cli.main:app"

[tool.poetry]
packages = [{ include = "asynq_team_cli", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4"
asynq-team-core = { path = "../core", develop = true }
PyYAML = ">=6,<7"
rich = ">=13,<15"
typer = ">=0.12,<1"

[tool.poetry.group.dev.dependencies]
pip-audit = ">=2.7,<3"
pytest = ">=9.0.3,<10"
ruff = "==0.16.4"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
